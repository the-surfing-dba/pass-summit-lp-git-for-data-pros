name: Open PR to main

on:
  push:
    branches: [prerelease]

permissions:
  contents: read
  pull-requests: write

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create or update PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing=$(gh pr list --base main --head prerelease --state open --json number --jq '.[0].number')
          if [ -z "$existing" ]; then
            gh pr create \
              --base main \
              --head prerelease \
              --title "Promote prerelease -> main" \
              --body "Auto-generated PR from prerelease. Latest commit: ${{ github.sha }}"
          else
            echo "PR #$existing already open; new commits are included automatically."
          fi
