# =============================================================================
#  Merge the prerelease -> main promote PR when it is APPROVED.
#
#  Fires on the human approval event (pull_request_review), which — unlike
#  ci.yml's pull_request trigger — is NOT suppressed for the bot-opened promote
#  PR. By the time you approve, gitleaks has already stamped the required
#  "Secret scan (gitleaks)" status on the head commit via the push-to-prerelease
#  run in ci.yml, so a plain merge succeeds — no --admin bypass, no PAT, no
#  auto-merge (the GITHUB_TOKEN can't arm enablePullRequestAutoMerge anyway).
# =============================================================================
name: Auto-merge approved promote PR

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    # Only an APPROVED review of an open prerelease -> main promote PR.
    if: >-
      github.event.review.state == 'approved' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref == 'prerelease' &&
      github.event.pull_request.state == 'open'
    runs-on: ubuntu-latest
    steps:
      - name: Wait for mergeable, then merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          # Give gitleaks a moment if it is still finishing on the push run.
          for i in $(seq 1 18); do
            state=$(gh pr view "$PR" --repo "$REPO" --json mergeStateStatus --jq '.mergeStateStatus')
            echo "attempt $i: mergeStateStatus=$state"
            case "$state" in
              CLEAN|UNSTABLE|HAS_HOOKS)
                gh pr merge "$PR" --repo "$REPO" --merge && exit 0 ;;
              DIRTY|DRAFT)
                echo "not mergeable ($state) — aborting"; exit 1 ;;
            esac
            sleep 10
          done
          echo "timed out waiting for the required check to pass"; exit 1
