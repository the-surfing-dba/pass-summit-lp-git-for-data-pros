# =============================================================================
#  Auto-merge the prerelease -> main promote PR the moment it is APPROVED.
#
#  Fires on the human approval event (pull_request_review), so it is NOT subject
#  to the GITHUB_TOKEN recursion guard that keeps ci.yml from running on the
#  bot-opened promote PR. On approval it merges — the same `gh pr merge --admin`
#  you run by hand.
#
#  REQUIRES a repo secret PROMOTE_TOKEN = a PAT owned by a repo ADMIN
#  (the-surfing-dba), scopes: contents:write + pull-requests:write. That admin
#  token is what lets the merge proceed past the still-pending required gitleaks
#  check, exactly like your manual --admin merge. Without the secret it falls
#  back to GITHUB_TOKEN, which will merge ONLY if every required check has
#  already passed (so it will just sit there, same as today).
# =============================================================================
name: Auto-merge approved promote PR

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    # Only an APPROVED review of a prerelease -> main promote PR.
    if: >-
      github.event.review.state == 'approved' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref == 'prerelease' &&
      github.event.pull_request.state == 'open'
    runs-on: ubuntu-latest
    steps:
      - name: Merge to main
        env:
          GH_TOKEN: ${{ secrets.PROMOTE_TOKEN || secrets.GITHUB_TOKEN }}
          HAVE_ADMIN: ${{ secrets.PROMOTE_TOKEN != '' }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$HAVE_ADMIN" = "true" ]; then
            # Admin PAT: merge past the pending required check, like `gh pr merge --admin`.
            gh pr merge "$PR" --repo "$REPO" --merge --admin
          else
            # No admin PAT: respect branch protection; merges only if checks already pass.
            gh pr merge "$PR" --repo "$REPO" --merge
          fi
